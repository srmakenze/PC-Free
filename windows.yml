services:
  windows:
    image: docker.io/dockurr/windows:latest
    container_name: pc-free-windows
    environment:
      VERSION: ${WINDOWS_VERSION:-11}
      RAM_SIZE: ${WINDOWS_RAM:-6G}
      CPU_CORES: ${WINDOWS_CPU:-4}
      DISK_SIZE: ${WINDOWS_DISK:-64G}
      USERNAME: ${WINDOWS_USERNAME:?Defina WINDOWS_USERNAME no arquivo .env}
      PASSWORD: ${WINDOWS_PASSWORD:?Defina WINDOWS_PASSWORD no arquivo .env}
    devices:
      - /dev/kvm:/dev/kvm
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "127.0.0.1:8006:8006"
      - "127.0.0.1:13389:3389/tcp"
      - "127.0.0.1:13389:3389/udp"
    volumes:
      - windows-data:/storage
    restart: unless-stopped
    stop_grace_period: 2m
volumes:
  windows-data:
